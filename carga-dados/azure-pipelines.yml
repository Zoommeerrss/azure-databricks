name: Deploy and Run - Carga Dados Estudantes (ETL)

trigger:
  branches:
    include:
      - dev 
  paths:
    exclude:
      - CARGA_DADOS.md

pool:
  vmImage: 'ubuntu-latest'

variables:
  # 🚀 CORRIGIDO: Vincula o grupo de variáveis da Library para que o pipeline leia o Client ID e Secret
  - group: 'azure-databricks-credentials'

  # Vinculado à URL real e estável do seu Workspace gerada na Azure
  - name: DATABRICKS_HOST
    value: 'https://adb-7405611752750506.6.azuredatabricks.net'
  
  # Nome exato do recurso lógico de Carga criado pelo seu Terraform
  - name: JOB_NAME
    value: 'Job-ETL-Carga-dev'

jobs:
- job: TriggerDatabricksJob
  displayName: 'Disparar Pipeline de Ingestão no Databricks'
  steps:

  # Passo 1: Autenticar e obter o token OAuth dinâmico usando o Service Principal
  - bash: |
      echo "Solicitando Token de Acesso Azure para o Databricks..."
      
      # 🚀 CORRIGIDO: Endpoint oficial v2.0 da Microsoft injetando o Tenant ID de forma correta na URL
      TOKEN_RESPONSE=$(curl -s -X POST "https://microsoftonline.com" \
        -d "grant_type=client_credentials" \
        -d "client_id=$(AZURE_CLIENT_ID)" \
        -d "client_secret=$(AZURE_CLIENT_SECRET)" \
        -d "scope=2ff814a6-3304-4ab8-85cb-cd0e6f879c1d/.default")
      
      DATABRICKS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')
      
      if [ -z "$DATABRICKS_TOKEN" ] || [ "$DATABRICKS_TOKEN" == "null" ]; then
        echo "❌ Erro Crítico: Falha ao gerar o token OAuth da Azure. Verifique as credenciais no Variable Group."
        exit 1
      fi
      
      echo "##vso[task.setvariable variable=db_token;issetsecret=true]$DATABRICKS_TOKEN"
    displayName: 'Obter Token OAuth Azure'
    env:
      AZURE_TENANT_ID: $(AZURE_TENANT_ID)
      AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
      AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)

  # Passo 2: Buscar o ID do Job e rodar a esteira de Carga de forma atômica
  - bash: |
      echo "Buscando o ID do Job no Databricks para: $(JOB_NAME)..."
      
      # Varre a API de Jobs buscando o match exato do seu nome de produção
      JOB_ID=$(curl -s -X GET "$(DATABRICKS_HOST)/api/2.1/jobs/list" \
        -H "Authorization: Bearer $(db_token)" \

        | jq -r --arg NAME "$(JOB_NAME)" '.jobs[] | select(.settings.name==$NAME) | .job_id')

      if [ -z "$JOB_ID" ] || [ "$JOB_ID" == "null" ]; then
        echo "❌ Erro: Job '$(JOB_NAME)' não foi localizado no Workspace do Databricks."
        exit 1
      fi

      echo "✅ Job ID Encontrado: $JOB_ID"
      echo "🚀 Disparando o pipeline de Ingestão de Dados de forma assíncrona..."
      
      curl -s -X POST "$(DATABRICKS_HOST)/api/2.1/jobs/run-now" \
        -H "Authorization: Bearer $(db_token)" \
        -H "Content-Type: application/json" \
        -d "{
          \"job_id\": $JOB_ID
        }" | jq .
        
      echo "▶️ Comando enviado com sucesso! Acompanhe o processamento do notebook real diretamente no Workspace."
    displayName: 'Executar Workflow de Carga no Databricks'
